<!doctype html>
<meta charset="utf-8">
<title>cockpit test</title>
<style>html,body{margin:0;background:#000}canvas{display:block;image-rendering:pixelated}</style>
<canvas id="c"></canvas>
<script src="cockpit.js"></script>
<script>
// ?w=640&h=360&z=2   window.over = {field: value} overrides live fields, window.freeze = seconds freezes time
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 640, H = +q.get('h') || 360, Z = +q.get('z') || 2;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; cv.style.width = W * Z + 'px'; cv.style.height = H * Z + 'px';
const ctx = cv.getContext('2d'), img = ctx.createImageData(W, H), fb = new Uint32Array(img.data.buffer);
const rgb = (r, g, b) => ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
const t0b = performance.now(); const art = buildCockpit(W, H); window.buildMs = performance.now() - t0b;
window.over = {}; window.freeze = null; window.msPerFrame = 0; window.frames = 0;
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const isle = (x, y) => Math.sin(x * 0.011) * Math.cos(y * 0.009) + Math.sin(x * 0.004 + 1.7) * Math.sin(y * 0.005 + 0.6) * 0.8 + Math.sin(x * 0.03 + y * 0.02) * 0.15;
const landAt = (x, y) => { const v = isle(x, y); return v > 0.95 ? 3 : v > 0.55 ? 2 : v > 0.38 ? 1 : 0; };
const SKY = [rgb(80, 150, 236), rgb(112, 180, 244), rgb(150, 208, 250), rgb(196, 230, 252)];
const SEA = [rgb(10, 96, 170), rgb(20, 128, 196), rgb(40, 168, 214)], TERR = [0, rgb(74, 214, 210), rgb(74, 160, 62), rgb(150, 150, 130)];
const times = new Float64Array(60); let ti = 0;
function frame(now) {
  const t = window.freeze !== null ? window.freeze : now / 1000;
  const live = {
    time: t, roll: Math.sin(t * 0.5) * 0.45, pitch: Math.sin(t * 0.33) * 0.14, heading: t * 0.2 + 1.3,
    pivotY: Math.round(H * 0.34), focal: W * 0.75, speed: 386 + Math.sin(t) * 40, speedMax: 600, alt: 7193 + Math.sin(t * 0.3) * 2600, altMax: 40000,
    climb: Math.sin(t * 0.33), turn: Math.sin(t * 0.5), boost: Math.max(0, Math.sin(t * 0.8)),
    headX: Math.sin(t * 0.5) * 5, headY: Math.sin(t * 0.7) * 2, hp: 0.72, missiles: 3, kills: 7, hit: 0, firing: false,
    lock: { x: W * 0.5 + Math.sin(t * 0.9) * W * 0.12, y: H * 0.3 + Math.cos(t * 0.7) * H * 0.07, locked: (t % 6) > 3, range: 284 },
    targets: [{ x: W * 0.33, y: H * 0.24, dist: 410 }, { x: W * 0.71, y: H * 0.41, dist: 520 }],
    blips: [60, 280, -210, 330, 150, -180], sunSide: Math.sin(t * 0.15 + 0.7), inPlace: 1, land: null,
  };
  Object.assign(live, window.over);
  live.horizonY = live.horizonY !== undefined ? live.horizonY : live.pivotY + live.focal * Math.tan(live.pitch);
  const wx = Math.sin(live.heading) * t * 60, wy = Math.cos(live.heading) * t * 60, ch = Math.cos(live.heading), sh = Math.sin(live.heading);
  live.land = live.land || ((r, a) => landAt(wx + r * ch + a * sh, wy - r * sh + a * ch));
  // fake world: sky gradient over a rolled horizon, sea with islands on a ground plane
  const cr = Math.cos(live.roll), sr = Math.sin(live.roll), py = live.pivotY, hz = live.horizonY - py, camH = 90;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = x - W / 2, dy = y - py, x0 = dx * cr - dy * sr, y0 = dx * sr + dy * cr, d = y0 - hz, b = BAY[((y & 3) << 2) | (x & 3)];
    let c;
    if (d < 0) { const g = Math.min(2.99, Math.max(0, 3 + d / (H * 0.22))); c = SKY[(g | 0) + ((g % 1) * 16 > b ? 1 : 0)]; }
    else { const z = live.focal * camH / (d + 0.5), gx = x0 * z / live.focal, m = z > 4000 ? 0 : live.land(gx, z); c = m ? TERR[m] : SEA[z > 1500 ? 2 : z > 500 ? 1 : (((gx * 0.05) ^ (z * 0.05)) & 7) === 0 ? 2 : 0]; }
    fb[y * W + x] = c;
  }
  const a = performance.now(); drawCockpit(fb, W, H, art, live); times[ti++ % 60] = performance.now() - a;
  window.frames++; window.msPerFrame = times.reduce((s, v) => s + v, 0) / Math.min(60, ti);
  ctx.putImageData(img, 0, 0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
